<script>
let numeros = [];
let pares = 0;
let impares = 0;

// Entrada: le 10 numeros inteiros e guarda no vetor
for (let i = 0; i < 10; i++) {
    numeros[i] = parseInt(prompt("Digite o numero inteiro " + (i + 1) + " de 10:"));
}

// Processamento: percorre o vetor e conta pares e impares
for (let i = 0; i < 10; i++) {
    if (numeros[i] % 2 == 0) {
        pares++;
    } else {
        impares++;
    }
}

// Saida: apresenta as quantidades
document.write("<h2>Resultado</h2>");
document.write("Quantidade de numeros pares: " + pares + "<br>");
document.write("Quantidade de numeros impares: " + impares + "<br>");
</script>
