<script>
let numeros = [];
let soma = 0;

// Entrada: le 10 numeros e guarda no vetor
for (let i = 0; i < 10; i++) {
    numeros[i] = parseFloat(prompt("Digite o numero " + (i + 1) + " de 10:"));
}

// Processamento: soma todos os elementos do vetor
for (let i = 0; i < 10; i++) {
    soma = soma + numeros[i];
}

// Saida: apresenta o resultado
document.write("<h2>Resultado</h2>");
document.write("Soma de todos os elementos: " + soma + "<br>");
</script>
